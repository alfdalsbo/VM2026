name: Sync World Cup data

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Kjør sync utenfor VM-vinduet og oppdater lag/tropper nå"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Tippekjelleren sync endpoint
        run: |
          url="https://tippekjelleren.vercel.app/api/sync/world-cup"
          if [ "${{ inputs.force }}" = "true" ]; then
            url="${url}?force=1"
          fi
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$url"
