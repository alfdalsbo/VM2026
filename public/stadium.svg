<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a5b"/>
      <stop offset="100%" stop-color="#345f86"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f8a44"/>
      <stop offset="100%" stop-color="#1f6a32"/>
    </linearGradient>
  </defs>

  <rect width="600" height="240" fill="url(#sky)"/>

  <!-- floodlight glows -->
  <circle cx="90" cy="34" r="40" fill="#ffffff" opacity="0.08"/>
  <circle cx="510" cy="34" r="40" fill="#ffffff" opacity="0.08"/>

  <!-- floodlight masts -->
  <g fill="#0f263b">
    <rect x="86" y="30" width="8" height="70"/>
    <rect x="66" y="18" width="48" height="16" rx="3"/>
    <rect x="506" y="30" width="8" height="70"/>
    <rect x="486" y="18" width="48" height="16" rx="3"/>
  </g>
  <g fill="#ffd23f">
    <circle cx="74" cy="26" r="3"/><circle cx="90" cy="26" r="3"/><circle cx="106" cy="26" r="3"/>
    <circle cx="494" cy="26" r="3"/><circle cx="510" cy="26" r="3"/><circle cx="526" cy="26" r="3"/>
  </g>

  <!-- upper stand roof -->
  <path d="M0 96 Q300 56 600 96 L600 120 Q300 84 0 120 Z" fill="#0f263b"/>

  <!-- stands with crowd speckle -->
  <path d="M0 116 Q300 80 600 116 L600 168 L0 168 Z" fill="#24486b"/>
  <g fill="#cfe0f0" opacity="0.5">
    <circle cx="60" cy="132" r="2"/><circle cx="110" cy="126" r="2"/><circle cx="170" cy="120" r="2"/>
    <circle cx="240" cy="116" r="2"/><circle cx="320" cy="116" r="2"/><circle cx="400" cy="120" r="2"/>
    <circle cx="470" cy="126" r="2"/><circle cx="540" cy="132" r="2"/>
    <circle cx="90" cy="146" r="2"/><circle cx="200" cy="140" r="2"/><circle cx="300" cy="138" r="2"/>
    <circle cx="420" cy="140" r="2"/><circle cx="520" cy="146" r="2"/>
  </g>

  <!-- pitch -->
  <path d="M0 162 L600 162 L600 240 L0 240 Z" fill="url(#grass)"/>
  <g opacity="0.18" fill="#ffffff">
    <rect x="0" y="162" width="75" height="78"/>
    <rect x="150" y="162" width="75" height="78"/>
    <rect x="300" y="162" width="75" height="78"/>
    <rect x="450" y="162" width="75" height="78"/>
  </g>
  <!-- centre circle + line -->
  <g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7">
    <line x1="300" y1="162" x2="300" y2="240"/>
    <ellipse cx="300" cy="206" rx="40" ry="22"/>
  </g>
  <circle cx="300" cy="206" r="3" fill="#ffffff" opacity="0.7"/>
</svg>
