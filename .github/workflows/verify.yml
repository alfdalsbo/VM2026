name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TIPPEKJELLEREN_PASSCODE: Norge
      AUTH_SECRET: github-actions-vm2026-secret
      ADMIN_PLAYER_IDS: alf
      CRON_SECRET: github-actions-vm2026-cron-secret
      ODDS_API_KEY: ""
      BLOB_READ_WRITE_TOKEN: ""
      DATABASE_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
